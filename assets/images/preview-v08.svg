<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1119"/>
      <stop offset="50%" stop-color="#140b12"/>
      <stop offset="100%" stop-color="#070306"/>
    </linearGradient>
    <radialGradient id="redAlarm" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff2a4b" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#990022" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stairs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2218"/>
      <stop offset="100%" stop-color="#1a0c07"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg08)"/>

  <!-- Basement / Living room architecture -->
  <polygon points="0,0 240,60 240,380 0,450" fill="#0d080c" opacity="0.9"/>
  <polygon points="800,0 560,60 560,380 800,450" fill="#120a10" opacity="0.95"/>
  <polygon points="240,60 560,60 560,380 240,380" fill="#160e18"/>
  <polygon points="0,450 240,380 560,380 800,450" fill="#1f1412"/>

  <!-- Window with moon/street light and rain streaks -->
  <rect x="280" y="90" width="120" height="150" fill="#1a2536" stroke="#485c7b" stroke-width="3"/>
  <line x1="340" y1="90" x2="340" y2="240" stroke="#485c7b" stroke-width="2"/>
  <line x1="280" y1="165" x2="400" y2="165" stroke="#485c7b" stroke-width="2"/>
  <circle cx="370" cy="120" r="18" fill="#e3efff" opacity="0.85"/>

  <!-- Bear Trap on floor -->
  <g transform="translate(420, 360)">
    <ellipse cx="0" cy="0" rx="36" ry="12" fill="none" stroke="#6b7280" stroke-width="4"/>
    <path d="M -30,-6 L -24,4 L -18,-6 L -12,4 L -6,-6 L 0,4 L 6,-6 L 12,4 L 18,-6 L 24,4 L 30,-6" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#e11d48"/>
  </g>

  <!-- Camera / Alarm Siren -->
  <g transform="translate(540, 75)">
    <circle cx="0" cy="0" r="12" fill="#ff1744"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ff1744" stroke-width="2" opacity="0.6"/>
    <path d="M -30,-10 L -5,0 L -30,10 Z" fill="#ff1744" opacity="0.3"/>
  </g>

  <!-- Ominous Neighbor in v0.8 (Close & Aggressive) -->
  <g transform="translate(440, 160)">
    <!-- Body -->
    <path d="M 40,80 C 10,70 -10,110 -15,180 L 115,180 C 110,110 90,70 60,80 Z" fill="#08070d"/>
    <!-- Yellow Sweater / Vest stripe -->
    <path d="M 10,120 L 90,120 L 85,150 L 15,150 Z" fill="#d97706" opacity="0.8"/>
    <path d="M 25,120 L 75,120 L 70,150 L 30,150 Z" fill="#2563eb" opacity="0.7"/>
    <!-- Head -->
    <ellipse cx="50" cy="50" rx="28" ry="34" fill="#0b080f"/>
    <!-- Mustache silhouette -->
    <path d="M 32,62 Q 50,56 68,62 Q 50,70 32,62 Z" fill="#000000"/>
    <!-- Glowing hostile eyes -->
    <circle cx="42" cy="46" r="4.5" fill="#ff0033"/>
    <circle cx="58" cy="46" r="4.5" fill="#ff0033"/>
  </g>

  <!-- Alarm lighting overlay -->
  <rect width="800" height="450" fill="url(#redAlarm)"/>

  <!-- Scanlines & Noise effect -->
  <pattern id="scanlines2" width="100" height="3" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="1" opacity="0.25"/>
  </pattern>
  <rect width="800" height="450" fill="url(#scanlines2)"/>

  <!-- HUD overlay (v0.8) -->
  <rect x="25" y="25" width="230" height="34" rx="4" fill="#000" fill-opacity="0.7" stroke="#ff0055" stroke-width="1"/>
  <text x="35" y="48" fill="#ff2a6d" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" letter-spacing="1">VERSION: 0.8 PRE-POST</text>

  <rect x="620" y="25" width="155" height="34" rx="4" fill="#000" fill-opacity="0.7" stroke="#ffaa00" stroke-width="1"/>
  <text x="635" y="48" fill="#ffbb00" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="13" letter-spacing="1">! DETECTED !</text>

  <!-- Sneak / Stealth eye meter -->
  <g transform="translate(400, 40)">
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#ff3355" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ff3355"/>
  </g>

  <!-- Crosshair -->
  <circle cx="400" cy="225" r="3" fill="#ffffff" opacity="0.7"/>
  <line x1="390" y1="225" x2="396" y2="225" stroke="#ff3355" stroke-width="1.5"/>
  <line x1="404" y1="225" x2="410" y2="225" stroke="#ff3355" stroke-width="1.5"/>
  <line x1="400" y1="215" x2="400" y2="221" stroke="#ff3355" stroke-width="1.5"/>
  <line x1="400" y1="229" x2="400" y2="235" stroke="#ff3355" stroke-width="1.5"/>

  <!-- Bottom Label -->
  <rect x="20" y="395" width="270" height="32" rx="4" fill="#000000" fill-opacity="0.8"/>
  <text x="32" y="416" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Капканы соседа и обнаружение тревоги</text>
</svg>
